<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>소리 사냥꾼</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #555;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #pad { position: fixed; inset: 0; display: flex; }
  #pad > div { flex: 1; }
  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; padding: 16px; box-sizing: border-box; pointer-events: none;
    line-height: 1.6; font-size: 15px;
  }
  #intro h1 { color: #888; font-size: 22px; margin: 0 0 12px; }
  #intro p { margin: 4px 0; max-width: 420px; }
  body.playing #intro { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<!-- 화면은 일부러 비워 둡니다. 게임은 소리로만 진행됩니다. -->
<div id="pad" aria-hidden="true"><div data-dir="-1"></div><div data-dir="0"></div><div data-dir="1"></div></div>
<div id="intro">
  <h1>소리 사냥꾼</h1>
  <p>🎧 이어폰을 끼고 눈을 감으세요.</p>
  <p>괴물 발소리가 들리는 쪽을 공격하세요.<br>← 왼쪽 · ↑ 앞 · → 오른쪽<br>(휴대폰: 화면 왼쪽 · 가운데 · 오른쪽 누르기)</p>
  <p>종소리는 친구입니다. 공격하지 마세요.</p>
  <p><b>스페이스 / 화면 누르기</b>로 시작</p>
</div>
<div id="live" class="sr" aria-live="assertive"></div>

<script>
"use strict";

// ---------- 음성 안내 ----------
const live = document.getElementById("live");
let koVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("ko")) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function say(text, { interrupt = true, rate = 1.1 } = {}) {
  live.textContent = text;
  if (!("speechSynthesis" in window)) return Promise.resolve();
  if (interrupt) speechSynthesis.cancel();
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = rate;
    if (koVoice) u.voice = koVoice;
    u.onend = u.onerror = resolve;
    speechSynthesis.speak(u);
    setTimeout(resolve, 600 + text.length * 180); // 일부 브라우저는 onend가 안 옴
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---------- 소리 합성 ----------
let ac, master, noiseBuf;
function initAudio() {
  if (ac) { ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor();
  master.connect(comp).connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function panner(pan) {
  const p = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
  if (p.pan) p.pan.value = pan;
  p.connect(master);
  return p;
}

function noise(t, dur, { freq = 800, q = 1, type = "bandpass", gain = 0.5, out = master } = {}) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(out);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  return f;
}

function tone(t, freq, dur, { type = "sine", gain = 0.3, out = master, slideTo } = {}) {
  const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
}

const sfx = {
  // 방향 안내용 짧은 소리
  ping(pan) { const t = ac.currentTime; const p = panner(pan); tone(t, 660, 0.25, { gain: 0.4, out: p }); },
  hit(pan) {
    const t = ac.currentTime; const p = panner(pan);
    noise(t, 0.18, { freq: 2500, q: 0.7, gain: 0.9, out: p });
    tone(t, 400, 0.3, { type: "square", gain: 0.25, slideTo: 60, out: p });
    tone(t + 0.08, 880, 0.15, { gain: 0.2, out: master });
  },
  swing(pan) {
    const t = ac.currentTime; const p = panner(pan);
    const f = noise(t, 0.22, { freq: 600, q: 2, gain: 0.35, out: p });
    f.frequency.exponentialRampToValueAtTime(3000, t + 0.2);
  },
  hurt() {
    const t = ac.currentTime;
    tone(t, 120, 0.5, { type: "sawtooth", gain: 0.5, slideTo: 40 });
    noise(t, 0.4, { freq: 200, type: "lowpass", gain: 1 });
    if (navigator.vibrate) navigator.vibrate(300);
  },
  friendOk() { const t = ac.currentTime; [784, 988, 1175, 1568].forEach((f, i) => tone(t + i * 0.09, f, 0.35, { gain: 0.2 })); },
  friendHurt(pan) { const t = ac.currentTime; const p = panner(pan); tone(t, 600, 0.6, { type: "triangle", gain: 0.35, slideTo: 150, out: p }); },
  levelUp() { const t = ac.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(t + i * 0.12, f, 0.3, { type: "triangle", gain: 0.25 })); },
  gameOver() { const t = ac.currentTime; [392, 330, 262, 196].forEach((f, i) => tone(t + i * 0.25, f, 0.45, { type: "triangle", gain: 0.3 })); },
  heartbeat(strength) {
    const t = ac.currentTime;
    tone(t, 55, 0.12, { gain: strength }); tone(t + 0.16, 50, 0.14, { gain: strength * 0.8 });
  },
};

// ---------- 다가오는 존재 (괴물 / 친구) ----------
const DIR_NAME = { "-1": "왼쪽", "0": "앞", "1": "오른쪽" };

class Walker {
  constructor(dir, kind, travelSec) {
    this.dir = dir; this.kind = kind;          // kind: "monster" | "friend"
    this.travel = travelSec; this.age = 0; this.dist = 1; this.alive = true;
    this.out = ac.createGain(); this.out.gain.value = 0.05;
    this.lp = ac.createBiquadFilter(); this.lp.type = "lowpass"; this.lp.frequency.value = 500;
    this.lp.connect(this.out).connect(panner(dir * 0.95));
    this.nextStep = 0;
    this.pitch = 0.85 + Math.random() * 0.3;
    if (kind === "monster") {
      // 낮게 그르렁거리는 소리
      this.osc = ac.createOscillator(); this.osc.type = "sawtooth"; this.osc.frequency.value = 70 * this.pitch;
      const lfo = ac.createOscillator(); lfo.frequency.value = 6 + Math.random() * 4;
      const lfoG = ac.createGain(); lfoG.gain.value = 0.5;
      this.growl = ac.createGain(); this.growl.gain.value = 0.5;
      lfo.connect(lfoG).connect(this.growl.gain);
      this.osc.connect(this.growl).connect(this.lp);
      this.osc.start(); lfo.start(); this.lfo = lfo;
    }
  }
  step(t) {
    if (this.kind === "monster") {
      noise(t, 0.09, { freq: 140 * this.pitch, q: 1.2, gain: 1.2, out: this.lp });
      noise(t, 0.04, { freq: 900, q: 1, gain: 0.4, out: this.lp });
    } else {
      // 친구: 맑은 종소리 + 가벼운 발걸음
      tone(t, 1320 * this.pitch, 0.4, { gain: 0.35, out: this.lp });
      tone(t, 1980 * this.pitch, 0.25, { gain: 0.15, out: this.lp });
      noise(t, 0.03, { freq: 2500, q: 2, gain: 0.3, out: this.lp });
    }
  }
  update(dt) {
    this.age += dt;
    this.dist = Math.max(0, 1 - this.age / this.travel);
    const near = 1 - this.dist;
    const t = ac.currentTime;
    this.out.gain.setTargetAtTime(0.06 + near * near * 0.95, t, 0.05);
    this.lp.frequency.setTargetAtTime(this.kind === "friend" ? 2500 + near * 6000 : 300 + near * 4000, t, 0.05);
    if (this.age >= this.nextStep) {
      this.step(t);
      this.nextStep = this.age + (this.kind === "friend" ? 0.45 : 0.22 + this.dist * 0.35);
    }
    return this.dist <= 0;
  }
  stop() {
    this.alive = false;
    const t = ac.currentTime;
    this.out.gain.cancelScheduledValues(t);
    this.out.gain.setTargetAtTime(0, t, 0.03);
    if (this.osc) { this.osc.stop(t + 0.2); this.lfo.stop(t + 0.2); }
    setTimeout(() => this.out.disconnect(), 400);
  }
}

// ---------- 게임 진행 ----------
const BEST_KEY = "sound-hunter-best";
const getBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch { return 0; } };
const setBest = v => { try { localStorage.setItem(BEST_KEY, v); } catch {} };

const S = { mode: "menu", score: 0, lives: 3, level: 1, kills: 0, walkers: [], nextSpawn: 0, cooldown: 0, paused: false, beat: 0 };

function travelTime() { return Math.max(1.4, 4.2 - (S.level - 1) * 0.35); }

function spawn() {
  const busy = new Set(S.walkers.map(w => w.dir));
  const free = [-1, 0, 1].filter(d => !busy.has(d));
  if (!free.length) return;
  const dir = free[Math.floor(Math.random() * free.length)];
  const friend = S.level >= 3 && Math.random() < 0.25;
  S.walkers.push(new Walker(dir, friend ? "friend" : "monster", friend ? travelTime() * 1.2 : travelTime()));
}

function scheduleSpawn() {
  // 레벨 5부터는 가끔 두 마리가 동시에 다가옴
  const max = S.level >= 5 ? 2 : 1;
  if (S.nextSpawn <= 0 && S.walkers.length < max) S.nextSpawn = 0.7 + Math.random() * (S.level >= 5 ? 0.9 : 1.2);
}

function removeWalker(w) {
  w.stop();
  S.walkers = S.walkers.filter(x => x !== w);
  scheduleSpawn();
}

function loseLife() {
  S.lives--;
  sfx.hurt();
  if (S.lives <= 0) { endGame(); return; }
  say(`아야! 남은 목숨 ${S.lives}`);
}

async function levelUp() {
  S.level++;
  sfx.levelUp();
  await wait(500);
  if (S.mode === "play") say(`레벨 ${S.level}` + (S.level === 3 ? ". 이제 종소리 친구가 와요. 공격하지 마세요" : S.level === 5 ? ". 이제 두 마리씩 와요" : ""));
}

function strike(dir) {
  if (S.mode !== "play" || S.paused || S.cooldown > 0) return;
  const w = S.walkers.find(x => x.dir === dir);
  if (!w) { sfx.swing(dir); S.cooldown = 0.35; return; }
  if (w.kind === "friend") {
    sfx.friendHurt(dir);
    removeWalker(w);
    S.lives--;
    if (S.lives <= 0) { endGame(); return; }
    say(`친구를 때렸어요. 남은 목숨 ${S.lives}`);
    return;
  }
  sfx.hit(dir);
  const bonus = Math.round(10 + w.dist * 20) * S.level; // 멀리서 맞힐수록 높은 점수
  S.score += bonus; S.kills++;
  removeWalker(w);
  if (S.kills % 5 === 0) levelUp();
}

let last = 0;
function tick() {
  const now = performance.now() / 1000;
  const dt = Math.min(0.1, now - (last || now)); last = now;
  if (S.mode === "play" && !S.paused) {
    S.cooldown = Math.max(0, S.cooldown - dt);
    if (S.nextSpawn > 0) { S.nextSpawn -= dt; if (S.nextSpawn <= 0) { S.nextSpawn = 0; spawn(); scheduleSpawn(); } }
    for (const w of [...S.walkers]) {
      if (w.update(dt)) {
        removeWalker(w);
        if (w.kind === "friend") { sfx.friendOk(); S.score += 15 * S.level; S.lives = Math.min(5, S.lives + 1); say(`친구가 목숨을 줬어요. 목숨 ${S.lives}`); }
        else loseLife();
        if (S.mode !== "play") break;
      }
    }
    // 목숨이 적을수록 빨라지는 심장 소리
    if (S.lives <= 2) {
      S.beat -= dt;
      if (S.beat <= 0) { sfx.heartbeat(S.lives === 1 ? 0.5 : 0.25); S.beat = S.lives === 1 ? 0.6 : 1.0; }
    }
  }
}
setInterval(tick, 25);

async function tutorial() {
  S.mode = "tutorial";
  await say("소리 사냥꾼. 이어폰을 끼고 눈을 감으세요.");
  for (const d of [-1, 0, 1]) {
    if (S.mode !== "tutorial") return;
    sfx.ping(d); await wait(350); await say(DIR_NAME[d], { rate: 1.3 }); await wait(250);
  }
  if (S.mode !== "tutorial") return;
  await say("괴물 발소리가 들리는 쪽 화살표를 누르세요. 휴대폰은 화면의 왼쪽, 가운데, 오른쪽을 누르세요. 종소리는 친구니까 공격하지 마세요. 시작합니다.");
  if (S.mode === "tutorial") startGame();
}

function startGame() {
  speechSynthesis && speechSynthesis.cancel();
  S.walkers.forEach(w => w.stop());
  Object.assign(S, { mode: "play", score: 0, lives: 3, level: 1, kills: 0, walkers: [], cooldown: 0, paused: false, beat: 0, nextSpawn: 1.0 });
}

async function endGame() {
  S.mode = "over";
  S.walkers.forEach(w => w.stop()); S.walkers = [];
  sfx.gameOver();
  const best = getBest();
  const record = S.score > best;
  if (record) setBest(S.score);
  await wait(1100);
  await say(`게임 끝. 점수 ${S.score}점, 레벨 ${S.level}. ` + (record ? "최고 기록입니다!" : `최고 기록은 ${best}점.`) + " 다시 하려면 스페이스나 화면을 누르세요.");
}

function tellStatus() { say(`점수 ${S.score}, 목숨 ${S.lives}, 레벨 ${S.level}`); }

function togglePause() {
  if (S.mode !== "play") return;
  S.paused = !S.paused;
  if (S.paused) { ac.suspend(); say("일시정지. 다시 누르면 계속합니다"); }
  else { ac.resume(); say("계속"); }
}

function begin() {
  initAudio();
  document.body.classList.add("playing");
  if (S.mode === "menu") tutorial();
  else if (S.mode === "tutorial") startGame();   // 설명 건너뛰기
  else if (S.mode === "over") startGame();
}

// ---------- 입력 ----------
document.addEventListener("keydown", e => {
  const k = e.key;
  if ([" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (S.mode !== "play") { if (k === " " || k === "Enter") begin(); return; }
  if (k === "ArrowLeft" || k === "a" || k === "A") strike(-1);
  else if (k === "ArrowUp" || k === "w" || k === "W" || k === "ArrowDown" || k === "s" || k === "S") strike(0);
  else if (k === "ArrowRight" || k === "d" || k === "D") strike(1);
  else if (k === "r" || k === "R") tellStatus();
  else if (k === "p" || k === "P" || k === "Escape") togglePause();
});

document.getElementById("pad").addEventListener("pointerdown", e => {
  e.preventDefault();
  if (S.mode !== "play") { begin(); return; }
  if (S.paused) { togglePause(); return; }
  strike(+e.target.dataset.dir);
});
// 휴대폰: 두 손가락으로 누르면 상태 안내
document.addEventListener("touchstart", e => { if (e.touches.length === 2 && S.mode === "play") tellStatus(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && S.mode === "play" && !S.paused) togglePause(); });
</script>
</body>
</html>
