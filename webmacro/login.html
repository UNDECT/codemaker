<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<title>매크로 로그인</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1d2330;--mute:#6b7280;--line:#e2e5ea;--acc:#2563eb;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--fg:#e6e9ee;--mute:#9aa3af;--line:#2b323c;--acc:#60a5fa;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:20px;margin:0 0 4px}
p{color:var(--mute);margin:0 0 18px;font-size:14px}
input{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff}
#err{color:var(--bad);font-size:14px;min-height:1.5em;margin-top:10px}
</style>
</head>
<body>
<form id="f">
  <h1>업무 매크로</h1>
  <p>관리 화면 비밀번호를 입력하세요. 이 기기에서 30일간 로그인이 유지됩니다.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" autofocus required>
  <button>로그인</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: document.getElementById('pw').value})});
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json()).error || '로그인 실패';
  } catch (_) { err.textContent = '서버에 연결할 수 없습니다'; }
};
</script>
</body>
</html>
